    <script>
    (()=>{
        function getCookie(name) {
        const cookies = document.cookie.split('; ');
        for (const cookie of cookies) {
            const [key, value] = cookie.split('=');
            if (key === name) {
            return decodeURIComponent(value);
            }
        }
        return null;
        }
        if(getCookie("username") == null || getCookie("email") == null || getCookie("password") == null){
        for(i of document.getElementsByClassName("in")){
            i.style.display = "none"
        }
        } else {
        for(i of document.getElementsByClassName("out")){
            i.style.display = "none"
        }
        }
    })()
    </script>
